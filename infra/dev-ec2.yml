AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  citanz dev EC2 in citanz-nonprod (stage 1). Own small VPC with one public
  subnet so the Control Tower VPC is untouched; t3.small, T3 standard credits,
  Session Manager only (no SSH, no inbound ports), instance profile
  citanz-dev-ec2 (stack citanz-dev-ec2-role, owned by Alex). Used first for
  db-check/desensitise, later as dev.cita.org.nz. Delete the stack when done.

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium]
    Description: EC2 size. t3.small (2 GB) runs web + MySQL; larger types are blocked by policy.
  InstanceProfileName:
    Type: String
    Default: citanz-dev-ec2
    Description: Existing instance profile (stack citanz-dev-ec2-role, owned by Alex).
  ImageId:
    Type: AWS::EC2::Image::Id
    # Pinned on purpose. A changed ImageId replaces the instance, and the
    # database and uploads live on its root volume. To move to a newer
    # Amazon Linux 2023, look it up with
    #   aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    # back up first, then pass it as this parameter.
    Default: ami-062900c135ab91582
    Description: >-
      Amazon Linux 2023 AMI, pinned so that a stack update keeps the server.
      Changing it replaces the instance and loses its data.
  VolumeSizeGiB:
    Type: Number
    Default: 20
    MinValue: 10
    MaxValue: 100
    Description: Root volume size (encrypted gp3).
  VpcCidr:
    Type: String
    Default: 10.20.0.0/24
    AllowedPattern: '^\d{1,3}(\.\d{1,3}){3}/(1[6-9]|2[0-8])$'
    Description: CIDR for the stack's own small VPC (one public subnet uses all of it).
  ComposeVersion:
    Type: String
    Default: v2.27.0
    AllowedPattern: '^v\d+\.\d+\.\d+$'
    Description: Docker Compose release to install.
  ComposeSha256:
    Type: String
    Default: f3ba3bf1e4ab18e96c2d36526a075a02a78fb5f8e80d3e3ca9c5bf256d81d0a0
    AllowedPattern: '^[a-f0-9]{64}$'
    Description: SHA-256 of docker-compose-linux-x86_64 for ComposeVersion (from the release's .sha256 file). Change both together.
  DomainName:
    Type: String
    Default: dev.cita.org.nz
    Description: Site domain; an A record is created in HostedZoneId.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Default: Z08755273IMSLT13G5UZ   # dev.cita.org.nz zone in nonprod (delegated from prod by Alex)
    Description: Route 53 hosted zone for DomainName.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: citanz-dev}, {Key: Project, Value: citanz}, {Key: Environment, Value: nonprod}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: citanz-dev}, {Key: Project, Value: citanz}, {Key: Environment, Value: nonprod}]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref VpcCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: citanz-dev-public}, {Key: Project, Value: citanz}, {Key: Environment, Value: nonprod}]

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: citanz-dev}, {Key: Project, Value: citanz}, {Key: Environment, Value: nonprod}]

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # Free; keeps S3 traffic (the dump, assets) off the public internet.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref RouteTable]

  # Web only (80 for the HTTPS certificate challenge + redirect, 443 for the site).
  # No SSH: admin access is via Session Manager. The site itself sits behind a
  # basic-auth password and holds desensitised data only.
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_260
            comment: Port 80 must be open for the Let's Encrypt HTTP-01 challenge; Caddy only redirects it to HTTPS.
    Properties:
      GroupDescription: citanz dev EC2 - web in, all outbound
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: 'http - cert challenge and redirect'}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: https}
      SecurityGroupEgress:
        - {IpProtocol: '-1', CidrIp: 0.0.0.0/0, Description: 'all outbound - packages, images, AWS APIs, mail'}
      Tags: [{Key: Name, Value: citanz-dev}, {Key: Project, Value: citanz}, {Key: Environment, Value: nonprod}]

  Instance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfileName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref SecurityGroup]
      CreditSpecification: {CPUCredits: standard}   # no surprise CPU surplus charges
      # IMDSv2 only. Hop limit 2 lets a container reach the instance role (the
      # web container sends mail with it through the SES API); deploy-dev.sh
      # adds a host firewall rule so every other container is still blocked.
      MetadataOptions: {HttpTokens: required, HttpEndpoint: enabled, HttpPutResponseHopLimit: 2}
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSizeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker git
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/${ComposeVersion}/docker-compose-linux-x86_64
          echo "${ComposeSha256}  /usr/local/lib/docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version
      Tags:
        - {Key: Name, Value: citanz-dev}
        - {Key: Project, Value: citanz}
        - {Key: Environment, Value: nonprod}
        - {Key: ManagedBy, Value: cloudformation}

  # Fixed public IP so the DNS record survives stop/start.
  ElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref Instance
      Tags: [{Key: Name, Value: citanz-dev}, {Key: Project, Value: citanz}, {Key: Environment, Value: nonprod}]

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      TTL: '300'
      ResourceRecords: [!Ref ElasticIp]

Outputs:
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !Ref ElasticIp
  Url:
    Value: !Sub https://${DomainName}
  ConnectCommand:
    Value: !Sub aws ssm start-session --profile citanz-nonprod --region ${AWS::Region} --target ${Instance}
